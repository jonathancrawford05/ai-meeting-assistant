[tool.poetry]
name = "ai-meeting-assistant"
version = "0.1.0"
description = "Build an AI Meeting Assistant: Instant Notes, Zero Worries"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
transformers = "4.35.2"
torch = "2.1.1"
langchain = "^0.3.12"
langchain-community = "^0.3.12"
pydantic = "^2.10.3"
requests = "^2.31.0"
ollama = "^0.3.0"
langchain-ollama = "^0.2.0"
torchaudio = "^2.1.0"
numpy = "<2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
